<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart Tasks</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Chrono-node для парсинга дат на русском -->
  <script src="https://cdn.jsdelivr.net/npm/chrono-node@2.7.7/dist/bundle.min.js"></script>

  <!-- Canvas Confetti для визуальной награды -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    /* -------------------------------------------------------------------------
       СИСТЕМНЫЕ ПЕРЕМЕННЫЕ И ТЕМА iOS / TELEGRAM
       ------------------------------------------------------------------------- */
    :root {
      --tg-bg: var(--tg-theme-bg-color, #f2f2f7);
      --tg-sec-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --tg-text: var(--tg-theme-text-color, #000000);
      --tg-hint: var(--tg-theme-hint-color, #8e8e93);
      --tg-link: var(--tg-theme-link-color, #007aff);
      --tg-btn: var(--tg-theme-button-color, #007aff);
      --tg-btn-text: var(--tg-theme-button-text-color, #ffffff);
      --tg-danger: var(--tg-theme-destructive-text-color, #ff3b30);

      /* Glassmorphism и глубина */
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 255, 255, 0.45);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.06);
      --card-radius: 18px;
    }

    /* Поддержка темной темы Telegram */
    @media (prefers-color-scheme: dark) {
      :root {
        --glass-bg: rgba(30, 30, 30, 0.75);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.35);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    input {
      user-select: text;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--tg-bg);
      color: var(--tg-text);
      padding: 12px 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(40px, env(safe-area-inset-bottom));
      min-height: 100vh;
      touch-action: manipulation;
    }

    /* -------------------------------------------------------------------------
       ШАПКА С ПРОГРЕССОМ ДНЯ
       ------------------------------------------------------------------------- */
    .header-card {
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: var(--card-radius);
      padding: 16px;
      margin-bottom: 14px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .today-date {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--tg-hint);
    }

    .progress-stats {
      font-size: 13px;
      font-weight: 600;
      color: var(--tg-link);
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(142, 142, 147, 0.18);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--tg-link), #34c759);
      border-radius: 999px;
      transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* -------------------------------------------------------------------------
       СТЕКЛЯННЫЙ ВВОД ЗАДАЧИ
       ------------------------------------------------------------------------- */
    .input-wrapper {
      position: sticky;
      top: max(8px, env(safe-area-inset-top));
      z-index: 100;
      margin-bottom: 14px;
    }

    .glass-input-container {
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: var(--card-radius);
      padding: 7px 8px 7px 16px;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-input-container:focus-within {
      transform: translateY(-1px);
      box-shadow: 0 12px 36px 0 rgba(0, 0, 0, 0.12);
    }

    .task-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      background: transparent;
      color: var(--tg-text);
      font-weight: 400;
    }

    .task-input::placeholder {
      color: var(--tg-hint);
      font-size: 15px;
    }

    .btn-add {
      background: var(--tg-btn);
      color: var(--tg-btn-text);
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      font-weight: 500;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
    }

    .btn-add:active {
      transform: scale(0.92);
      opacity: 0.9;
    }

    /* -------------------------------------------------------------------------
       ФИЛЬТРЫ И ЧИПСЫ ТЕГОВ
       ------------------------------------------------------------------------- */
    .controls-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .tab-bar {
      display: flex;
      background: rgba(142, 142, 147, 0.14);
      padding: 3px;
      border-radius: 12px;
    }

    .tab-item {
      flex: 1;
      text-align: center;
      padding: 7px 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--tg-hint);
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tab-item.active {
      background: var(--tg-sec-bg);
      color: var(--tg-text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .tags-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .tags-scroll::-webkit-scrollbar {
      display: none;
    }

    .tag-chip {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      color: var(--tg-hint);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tag-chip.active {
      background: var(--tg-link);
      color: #ffffff;
      border-color: var(--tg-link);
      box-shadow: 0 3px 10px rgba(0, 122, 255, 0.3);
    }

    /* -------------------------------------------------------------------------
       КАРТОЧКА ЗАДАЧИ
       ------------------------------------------------------------------------- */
    .tasks-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: var(--card-radius);
      padding: 14px 14px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      box-shadow: var(--glass-shadow);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
      animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .task-card-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: var(--card-radius);
    }

    .swipe-bg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 0 18px;
      font-weight: 700;
      font-size: 14px;
      color: #ffffff;
      border-radius: var(--card-radius);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .swipe-bg.right {
      justify-content: flex-start;
      background: #34c759;
    }

    .swipe-bg.left {
      justify-content: flex-end;
      background: #ff3b30;
    }

    .task-card {
      touch-action: pan-y;
      will-change: transform;
    }
    .task-card.completed {
      opacity: 0.55;
    }

    .task-card.completed .task-title {
      text-decoration: line-through;
      color: var(--tg-hint);
    }

    /* Круглый нативный чекбокс Apple */
    .checkbox-container {
      width: 44px;
      height: 44px;
      margin: -10px 0 -10px -10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .custom-checkbox {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(142, 142, 147, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: transparent;
    }

    .task-card.completed .custom-checkbox {
      background: #34c759;
      border-color: #34c759;
      transform: scale(1.08);
      box-shadow: 0 3px 8px rgba(52, 199, 89, 0.4);
    }

    .custom-checkbox::after {
      content: '';
      width: 6px;
      height: 11px;
      border: solid white;
      border-width: 0 2.2px 2.2px 0;
      transform: rotate(45deg) translate(-1px, -1px);
      display: none;
    }

    .task-card.completed .custom-checkbox::after {
      display: block;
    }

    .task-body {
      flex: 1;
      min-width: 0;
      padding-top: 1px;
    }

    .task-title {
      font-size: 16px;
      line-height: 1.35;
      font-weight: 500;
      color: var(--tg-text);
      word-break: break-word;
      transition: color 0.2s ease;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }

    .badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 600;
      letter-spacing: -0.2px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .badge-priority {
      background: rgba(255, 59, 48, 0.14);
      color: #ff3b30;
    }

    .badge-date {
      background: rgba(142, 142, 147, 0.14);
      color: var(--tg-hint);
    }

    .badge-date.overdue {
      background: rgba(255, 59, 48, 0.14);
      color: #ff3b30;
    }

    .badge-tag {
      background: rgba(0, 122, 255, 0.12);
      color: var(--tg-link);
    }

    .btn-delete {
      width: 44px;
      height: 44px;
      margin: -10px -10px -10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--tg-hint);
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, color 0.15s ease;
    }

    .btn-delete:active {
      transform: scale(0.9);
      color: var(--tg-danger);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--tg-hint);
      font-size: 15px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Шапка с прогрессом дня -->
  <div class="header-card">
    <div class="header-top">
      <span class="today-date" id="headerDate">Сегодня</span>
      <span class="progress-stats" id="progressStats">0 из 0 • 0%</span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>

  <!-- Поле ввода с эффектом матового стекла -->
  <div class="input-wrapper">
    <div class="glass-input-container">
      <input type="text" id="taskInput" class="task-input" 
             placeholder="Купить молоко завтра в 18:00 #дом срочно" 
             autocomplete="off">
      <button class="btn-add" id="btnAdd" aria-label="Добавить">+</button>
    </div>
  </div>

  <!-- Управление и фильтры -->
  <div class="controls-row">
    <div class="tab-bar">
      <div class="tab-item active" data-tab="active">В работе</div>
      <div class="tab-item" data-tab="done">Готово</div>
      <div class="tab-item" data-tab="all">Все</div>
    </div>
    <div class="tags-scroll" id="tagsContainer"></div>
  </div>

  <!-- Список задач -->
  <div class="tasks-list" id="tasksList"></div>

  <script>
    /* -------------------------------------------------------------------------
       СОСТОЯНИЕ И КОНФИГУРАЦИЯ
       ------------------------------------------------------------------------- */
    const STORAGE_KEY = 'smart_tasks_data_v2';
    let tasks = [];
    let currentTab = 'active';
    let currentTag = null;

    const tg = window.Telegram?.WebApp;

    // Словарь авто-эмодзи для тегов
    const TAG_EMOJIS = {
      'работа': '💼', 'work': '💼', 'проект': '📊',
      'дом': '🏠', 'быт': '🧹', 'семья': '👨‍👩‍👧',
      'покупки': '🛒', 'купить': '🛍️', 'магазин': '🛒',
      'спорт': '🏋️', 'зал': '💪', 'треня': '🏃',
      'деньги': '💳', 'финансы': '💰', 'оплата': '🧾',
      'учеба': '📚', 'книга': '📖', 'курсы': '🎓',
      'здоровье': '💊', 'врач': '🩺', 'аптека': '🏥',
      'звонок': '📞', 'встреча': '🤝', 'созвон': '📱'
    };

    function getTagDisplay(tag) {
      const emoji = TAG_EMOJIS[tag.toLowerCase()] || '🏷️';
      return `${emoji} #${tag}`;
    }

    /* -------------------------------------------------------------------------
       ПАРСИНГ ТЕКСТА ЗАДАЧИ
       ------------------------------------------------------------------------- */
    function parseTask(rawText) {
      if (!rawText || !rawText.trim()) return null;

      let text = rawText.trim();
      let priority = 'normal';
      let tags = [];
      let deadline = null;

      try {
        // Приоритет
        const priorityRegex = /(?:^|\s)(срочно|важно|!!!)(?:\s|$)/gi;
        if (priorityRegex.test(text)) {
          priority = 'high';
          text = text.replace(priorityRegex, ' ').trim();
        }

        // Теги
        const tagRegex = /(?:^|\s)#([a-zA-Zа-яА-ЯёЁ0-9_-]+)/g;
        let tagMatch;
        while ((tagMatch = tagRegex.exec(text)) !== null) {
          tags.push(tagMatch[1].toLowerCase());
        }
        text = text.replace(tagRegex, ' ').trim();

        // Дата/время через Chrono
        const chronoParser = window.chrono?.ru || window.chrono;
        if (chronoParser) {
          const parsedResults = chronoParser.parse(text, new Date(), { forwardDate: true });
          if (parsedResults && parsedResults.length > 0) {
            const firstResult = parsedResults[0];
            deadline = firstResult.date().toISOString();
            text = text.replace(firstResult.text, ' ').trim();
          }
        }
      } catch (err) {
        console.error('Ошибка в парсере:', err);
      }

      let cleanedTitle = text.replace(/\s+/g, ' ').trim();
      // Делаем первую букву заглавной
      if (cleanedTitle.length > 0) {
        cleanedTitle = cleanedTitle.charAt(0).toUpperCase() + cleanedTitle.slice(1);
      }

      return {
        id: 'task_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
        title: cleanedTitle || rawText.trim(),
        deadline: deadline,
        priority: priority,
        tags: tags,
        completed: false,
        createdAt: new Date().toISOString()
      };
    }

    /* -------------------------------------------------------------------------
       ХРАНИЛИЩЕ (CloudStorage + Fallback)
       ------------------------------------------------------------------------- */
    const isCloudSupported = Boolean(
      tg?.isVersionAtLeast && tg.isVersionAtLeast('6.9') && tg.CloudStorage
    );

    function saveTasks() {
      const dataStr = JSON.stringify(tasks);
      localStorage.setItem(STORAGE_KEY, dataStr);

      if (isCloudSupported) {
        tg.CloudStorage.setItem(STORAGE_KEY, dataStr, (err) => {
          if (err) console.warn('Ошибка CloudStorage:', err);
        });
      }
    }

    function loadTasks() {
      return new Promise((resolve) => {
        if (isCloudSupported) {
          tg.CloudStorage.getItem(STORAGE_KEY, (err, value) => {
            if (!err && value) {
              try {
                resolve(JSON.parse(value));
                return;
              } catch (e) {}
            }
            loadLocal(resolve);
          });
        } else {
          loadLocal(resolve);
        }
      });
    }

    function loadLocal(resolve) {
      try {
        const local = localStorage.getItem(STORAGE_KEY);
        resolve(local ? JSON.parse(local) : []);
      } catch (e) {
        resolve([]);
      }
    }

    /* -------------------------------------------------------------------------
       ДЕЙСТВИЯ И ДОФАМИН (Confetti + Haptics)
       ------------------------------------------------------------------------- */
    function triggerConfetti(epic = false) {
      if (typeof confetti !== 'function') return;

      if (epic) {
        // Двойной салют при полном закрытии дня
        confetti({ particleCount: 70, spread: 80, origin: { y: 0.6 } });
        setTimeout(() => {
          confetti({ particleCount: 50, angle: 60, spread: 55, origin: { x: 0 } });
          confetti({ particleCount: 50, angle: 120, spread: 55, origin: { x: 1 } });
        }, 200);
      } else {
        // Легкий взрыв при одиночной задаче
        confetti({
          particleCount: 35,
          spread: 60,
          origin: { y: 0.75 },
          colors: ['#007aff', '#34c759', '#ff9500', '#ff2d55']
        });
      }
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const val = input.value;
      if (!val || !val.trim()) return;

      const newTask = parseTask(val);
      if (!newTask) return;

      tasks.unshift(newTask);
      saveTasks();
      render();

      input.value = '';
      tg?.HapticFeedback?.impactOccurred('light');
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      task.completed = !task.completed;
      saveTasks();
      render();

      if (task.completed) {
        tg?.HapticFeedback?.notificationOccurred('success');
        
        // Проверяем, закрыты ли вообще все задачи
        const activeCount = tasks.filter(t => !t.completed).length;
        if (activeCount === 0 && tasks.length > 0) {
          triggerConfetti(true); // Супер-салют
        } else {
          triggerConfetti(false); // Обычный салют
        }
      } else {
        tg?.HapticFeedback?.impactOccurred('light');
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      render();
      tg?.HapticFeedback?.impactOccurred('medium');
    }

    /* -------------------------------------------------------------------------
       РЕНДЕРИНГ ИНТЕРФЕЙСА
       ------------------------------------------------------------------------- */
    function updateHeaderStats() {
      // Обновляем текущую дату
      const now = new Date();
      const options = { weekday: 'long', month: 'long', day: 'numeric' };
      const dateStr = now.toLocaleDateString('ru-RU', options);
      document.getElementById('headerDate').textContent = dateStr;

      // Обновляем прогресс-бар
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

      document.getElementById('progressStats').textContent = `${completed} из ${total} • ${percent}%`;
      document.getElementById('progressBar').style.width = `${percent}%`;
    }

    function formatDeadline(isoString) {
      if (!isoString) return null;
      const date = new Date(isoString);
      const now = new Date();
      
      const isOverdue = date < now;
      const isToday = date.toDateString() === now.toDateString();

      const tomorrow = new Date();
      tomorrow.setDate(now.getDate() + 1);
      const isTomorrow = date.toDateString() === tomorrow.toDateString();

      const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let label = '';
      if (isToday) {
        label = `Сегодня, ${timeStr}`;
      } else if (isTomorrow) {
        label = `Завтра, ${timeStr}`;
      } else {
        const dayMonth = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
        label = `${dayMonth}, ${timeStr}`;
      }

      return { label, isOverdue };
    }

    function render() {
      updateHeaderStats();

      const listEl = document.getElementById('tasksList');
      const tagsContainer = document.getElementById('tagsContainer');

      // Чипсы тегов
      const allTags = new Set();
      tasks.forEach(t => t.tags?.forEach(tag => allTags.add(tag)));

      tagsContainer.innerHTML = '';
      if (allTags.size > 0) {
        const allChip = document.createElement('div');
        allChip.className = `tag-chip ${currentTag === null ? 'active' : ''}`;
        allChip.textContent = 'Все';
        allChip.onclick = () => { currentTag = null; render(); tg?.HapticFeedback?.impactOccurred('light'); };
        tagsContainer.appendChild(allChip);

        allTags.forEach(tag => {
          const chip = document.createElement('div');
          chip.className = `tag-chip ${currentTag === tag ? 'active' : ''}`;
          chip.textContent = getTagDisplay(tag);
          chip.onclick = () => {
            currentTag = currentTag === tag ? null : tag;
            render();
            tg?.HapticFeedback?.impactOccurred('light');
          };
          tagsContainer.appendChild(chip);
        });
      }

      // Фильтрация
      let filtered = tasks.filter(task => {
        if (currentTab === 'active' && task.completed) return false;
        if (currentTab === 'done' && !task.completed) return false;
        if (currentTag && (!task.tags || !task.tags.includes(currentTag))) return false;
        return true;
      });

      // Сортировка: Срочные -> По дедлайну -> По новизне
      filtered.sort((a, b) => {
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        if (a.priority === 'high' && b.priority !== 'high') return -1;
        if (a.priority !== 'high' && b.priority === 'high') return 1;

        if (a.deadline && b.deadline) return new Date(a.deadline) - new Date(b.deadline);
        if (a.deadline && !b.deadline) return -1;
        if (!a.deadline && b.deadline) return 1;

        return new Date(b.createdAt) - new Date(a.createdAt);
      });

      listEl.innerHTML = '';

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty-state">Нет задач в этом списке 🎉</div>`;
        return;
      }

      filtered.forEach(task => {
        // Обертка для подложки свайпа
        const wrapper = document.createElement('div');
        wrapper.className = 'task-card-wrapper';

        const swipeBgRight = document.createElement('div');
        swipeBgRight.className = 'swipe-bg right';
        swipeBgRight.textContent = '✓ Готово';

        const swipeBgLeft = document.createElement('div');
        swipeBgLeft.className = 'swipe-bg left';
        swipeBgLeft.textContent = 'Удалить ✕';

        const card = document.createElement('div');
        card.className = `task-card ${task.completed ? 'completed' : ''}`;

        // Логика тач-свайпа
        let startX = 0;
        let currentX = 0;

        card.addEventListener('touchstart', (e) => {
          startX = e.touches[0].clientX;
          card.style.transition = 'none';
        }, { passive: true });

        card.addEventListener('touchmove', (e) => {
          currentX = e.touches[0].clientX - startX;
          // Ограничиваем ход свайпа
          if (Math.abs(currentX) < 130) {
            card.style.transform = `translateX(${currentX}px)`;
            if (currentX > 20) {
              swipeBgRight.style.opacity = '1';
              swipeBgLeft.style.opacity = '0';
            } else if (currentX < -20) {
              swipeBgLeft.style.opacity = '1';
              swipeBgRight.style.opacity = '0';
            }
          }
        }, { passive: true });

        card.addEventListener('touchend', () => {
          card.style.transition = 'transform 0.25s cubic-bezier(0.16, 1, 0.3, 1)';
          card.style.transform = 'translateX(0px)';
          swipeBgRight.style.opacity = '0';
          swipeBgLeft.style.opacity = '0';

          // Порог срабатывания свайпа: 75 пикселей
          if (currentX > 75) {
            toggleTask(task.id);
          } else if (currentX < -75) {
            deleteTask(task.id);
          }
          currentX = 0;
        });

        wrapper.appendChild(swipeBgRight);
        wrapper.appendChild(swipeBgLeft);
        // Чекбокс
        const checkContainer = document.createElement('div');
        checkContainer.className = 'checkbox-container';
        checkContainer.onclick = () => toggleTask(task.id);
        const checkCircle = document.createElement('div');
        checkCircle.className = 'custom-checkbox';
        checkContainer.appendChild(checkCircle);

        // Тело
        const body = document.createElement('div');
        body.className = 'task-body';

        const title = document.createElement('div');
        title.className = 'task-title';
        title.textContent = task.title;
        body.appendChild(title);

        // Бейджи
        const meta = document.createElement('div');
        meta.className = 'task-meta';

        if (task.priority === 'high') {
          const pBadge = document.createElement('span');
          pBadge.className = 'badge badge-priority';
          pBadge.innerHTML = '⚡ Срочно';
          meta.appendChild(pBadge);
        }

        if (task.deadline) {
          const dInfo = formatDeadline(task.deadline);
          if (dInfo) {
            const dBadge = document.createElement('span');
            dBadge.className = `badge badge-date ${dInfo.isOverdue && !task.completed ? 'overdue' : ''}`;
            dBadge.textContent = (dInfo.isOverdue && !task.completed ? '⚠️ ' : '🕒 ') + dInfo.label;
            meta.appendChild(dBadge);
          }
        }

        if (task.tags && task.tags.length > 0) {
          task.tags.forEach(t => {
            const tBadge = document.createElement('span');
            tBadge.className = 'badge badge-tag';
            tBadge.textContent = getTagDisplay(t);
            meta.appendChild(tBadge);
          });
        }

        if (meta.children.length > 0) body.appendChild(meta);

        // Кнопка удаления
        const btnDelete = document.createElement('button');
        btnDelete.className = 'btn-delete';
        btnDelete.setAttribute('aria-label', 'Удалить');
        btnDelete.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        `;
        btnDelete.onclick = (e) => {
          e.stopPropagation();
          deleteTask(task.id);
        };

        card.appendChild(checkContainer);
        card.appendChild(body);
        card.appendChild(btnDelete);

      wrapper.appendChild(card);
        listEl.appendChild(wrapper);
      });
    }

    /* -------------------------------------------------------------------------
       ИНИЦИАЛИЗАЦИЯ
       ------------------------------------------------------------------------- */
    document.addEventListener('DOMContentLoaded', async () => {
      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
      }

      document.getElementById('btnAdd').addEventListener('click', addTask);
      document.getElementById('taskInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addTask();
        }
      });

      document.querySelectorAll('.tab-item').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentTab = tab.dataset.tab;
          render();
          tg?.HapticFeedback?.impactOccurred('light');
        });
      });

      tasks = await loadTasks();
      render();
    });
  </script>
</body>
</html>
