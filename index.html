<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Задачи</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Chrono-node (RU) -->
  <script src="https://cdn.jsdelivr.net/npm/chrono-node@2.7.7/dist/bundle.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    /* -------------------------------------------------------------------------
       ТЕМЫ ОФОРМЛЕНИЯ
       ------------------------------------------------------------------------- */
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 27, 39, 0.82);
      --text: #f0f6fc;
      --hint: #8b949e;
      --tint: #388bfd;
      --danger: #ff453a;
      --success: #32d74b;
      --separator: rgba(255, 255, 255, 0.08);
      --sheet-bg: #111622;
      --glow-1: rgba(56, 139, 253, 0.15);
      --glow-2: rgba(137, 87, 229, 0.12);
    }

    body[data-theme="oled"] {
      --bg: #000000;
      --card-bg: #121214;
      --text: #ffffff;
      --hint: #8e8e93;
      --tint: #0a84ff;
      --danger: #ff453a;
      --success: #30d158;
      --separator: rgba(255, 255, 255, 0.12);
      --sheet-bg: #161618;
      --glow-1: transparent;
      --glow-2: transparent;
    }

    body[data-theme="aurora"] {
      --bg: #0e091b;
      --card-bg: rgba(26, 18, 48, 0.75);
      --text: #f5f0ff;
      --hint: #9b8eb9;
      --tint: #bf5af2;
      --danger: #ff375f;
      --success: #00f2fe;
      --separator: rgba(255, 255, 255, 0.09);
      --sheet-bg: #150d29;
      --glow-1: rgba(191, 90, 242, 0.22);
      --glow-2: rgba(0, 242, 254, 0.12);
    }

    body[data-theme="warm"] {
      --bg: #f6f5f0;
      --card-bg: #ffffff;
      --text: #2c2523;
      --hint: #8f8885;
      --tint: #d9532f;
      --danger: #e02424;
      --success: #2e8b57;
      --separator: rgba(44, 37, 35, 0.08);
      --sheet-bg: #ffffff;
      --glow-1: rgba(217, 83, 47, 0.08);
      --glow-2: rgba(245, 158, 11, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    input {
      user-select: text;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px 16px 90px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(90px, env(safe-area-inset-bottom));
      min-height: 100vh;
      overflow-x: hidden;
      touch-action: pan-y;
      transition: background-color 0.35s ease, color 0.35s ease;
      position: relative;
    }

    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background: 
        radial-gradient(circle at 15% 15%, var(--glow-1) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, var(--glow-2) 0%, transparent 45%);
      transition: all 0.5s ease;
    }

    /* ШАПКА */
    .header-area {
      margin-bottom: 16px;
      padding: 4px 4px 0;
    }

    .header-top-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .header-date {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--hint);
    }

    .btn-settings {
      background: var(--card-bg);
      border: 1px solid var(--separator);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: var(--hint);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 0.15s ease;
    }

    .btn-settings:active {
      transform: scale(0.9);
      color: var(--tint);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .large-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.6px;
      line-height: 1.15;
    }

    .progress-pill {
      background: var(--card-bg);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--tint);
      border: 1px solid var(--separator);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .progress-pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--tint);
    }

    /* ФИЛЬТР ТЕГОВ */
    .tags-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 14px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .tags-bar::-webkit-scrollbar {
      display: none;
    }

    .tag-chip {
      background: var(--card-bg);
      color: var(--hint);
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid var(--separator);
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }

    .tag-chip.active {
      background: var(--tint);
      color: #ffffff;
      border-color: var(--tint);
    }

    /* СЕКЦИИ И СПИСКИ */
    .section-container {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--hint);
      margin-left: 14px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-card-group {
      background: transparent;
      border: none;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      gap: 8px; /* Отступы между овалами */
    }

    /* Подложка с цветом */
    .swipe-row-wrapper {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: transparent;
    }

    .swipe-reveal-bg {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      padding: 0 20px;
      font-weight: 700;
      font-size: 14px;
      color: #ffffff;
      border-radius: 16px;
      z-index: 1;
    }

    .swipe-reveal-bg.right {
      justify-content: flex-start;
      background: #32d74b;
    }

    .swipe-reveal-bg.left {
      justify-content: flex-end;
      background: #ff453a;
    }

   /* 100% непрозрачный овал: красный и зеленый свет сквозь него не проходят */
    .task-row {
      position: relative;
      background: #151a26;
      border: 1px solid var(--separator);
      border-radius: 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      z-index: 2;
      touch-action: pan-y;
      will-change: transform;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
    }

    body[data-theme="oled"] .task-row { background: #121214; }
    body[data-theme="aurora"] .task-row { background: #1a1230; }
    body[data-theme="warm"] .task-row { background: #ffffff; }
    .checkbox-touch {
      width: 24px;
      height: 24px;
      margin-top: 1px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .checkbox-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--hint);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      opacity: 0.7;
    }

    .completed .checkbox-circle {
      background: var(--success);
      border-color: var(--success);
      transform: scale(1.05);
      opacity: 1;
    }

    .checkbox-circle::after {
      content: '';
      width: 5px;
      height: 10px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) translate(-1px, -1px);
      display: none;
    }

    .completed .checkbox-circle::after {
      display: block;
    }

    .task-content {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .task-title {
      font-size: 16px;
      line-height: 1.35;
      font-weight: 450;
      color: var(--text);
      word-break: break-word;
    }

    .completed .task-title {
      text-decoration: line-through;
      color: var(--hint);
      opacity: 0.6;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
    }

    .meta-tag {
      font-size: 11px;
      font-weight: 500;
      color: var(--hint);
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .meta-tag.urgent { color: var(--danger); font-weight: 600; }
    .meta-tag.overdue { color: var(--danger); font-weight: 600; }
    .meta-tag.category { color: var(--tint); }

    .accordion-toggle {
      width: 100%;
      background: transparent;
      border: none;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--hint);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--hint);
    }

    .empty-state-icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .empty-state-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    /* FAB (+) */
    .fab-btn {
      position: fixed;
      right: 20px;
      bottom: max(24px, env(safe-area-inset-bottom));
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--tint);
      color: #ffffff;
      border: none;
      font-size: 32px;
      font-weight: 300;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      z-index: 100;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .fab-btn:active {
      transform: scale(0.9);
    }

    /* МОДАЛЬНЫЕ ШТОРКИ */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 200;
    }

    .sheet-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--sheet-bg);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 12px 18px max(24px, env(safe-area-inset-bottom));
      border: 1px solid var(--separator);
      border-bottom: none;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.4);
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 210;
    }

    .bottom-sheet.active {
      transform: translateY(0);
    }

    .sheet-grabber {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--separator);
      margin: 0 auto 16px;
    }

    .sheet-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    /* Строка ввода задачи с микрофоном */
    .sheet-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .sheet-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 18px;
      font-weight: 500;
    }

    .sheet-input::placeholder {
      color: var(--hint);
      font-weight: 400;
    }

    .btn-voice {
      background: var(--card-bg);
      border: 1px solid var(--separator);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .btn-voice:active { transform: scale(0.92); }

    .btn-voice.recording {
      background: var(--danger);
      border-color: var(--danger);
      animation: pulseMic 1.2s infinite;
    }

    @keyframes pulseMic {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 69, 58, 0.6); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(255, 69, 58, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 69, 58, 0); }
    }

    .sheet-options-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .option-pill {
      background: var(--card-bg);
      border: 1px solid var(--separator);
      color: var(--hint);
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .option-pill.active {
      background: var(--tint);
      color: #ffffff;
      border-color: var(--tint);
    }

    .option-pill.active.urgent {
      background: var(--danger);
      border-color: var(--danger);
    }

    .sheet-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-sheet-submit {
      background: var(--tint);
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn-sheet-submit:active { transform: scale(0.95); }

    /* СЕТКА ТЕМ */
    .theme-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .theme-card {
      background: var(--card-bg);
      border: 2px solid var(--separator);
      border-radius: 16px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .theme-card.active {
      border-color: var(--tint);
    }

    .theme-preview {
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .theme-name {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body data-theme="midnight">

  <div class="ambient-glow"></div>

  <!-- Шапка -->
  <div class="header-area">
    <div class="header-top-line">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="header-date" id="headerDate">СЕГОДНЯ</div>
        <div id="streakBadge" style="display: none; font-size: 11px; font-weight: 700; background: rgba(255, 149, 0, 0.15); color: #ff9500; padding: 2px 7px; border-radius: 999px;">🔥 0</div>
      </div>
      <button class="btn-settings" id="btnSettings" aria-label="Настройки">⚙️</button>
    </div>
    <div class="header-row">
      <h1 class="large-title">Задачи</h1>
      <div class="progress-pill">
        <div class="progress-pill-dot"></div>
        <span id="progressText">0/0</span>
      </div>
    </div>
  </div>

  <div class="tags-bar" id="tagsBar"></div>
  <div id="sectionsContainer"></div>
  <div id="doneAccordionContainer"></div>

  <!-- Кнопка (+) -->
  <button class="fab-btn" id="fabBtn" aria-label="Создать задачу">+</button>

  <!-- ШТОРКА ЗАДАЧИ -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-grabber"></div>
    <div class="sheet-input-row">
      <input type="text" id="sheetInput" class="sheet-input" placeholder="Что сделать?" autocomplete="off">
      <button class="btn-voice" id="btnVoice" type="button" aria-label="Голос">🎙️</button>
    </div>
    
    <div class="sheet-options-row">
      <div class="option-pill" id="pillDate">📅 Срок</div>
      <div class="option-pill" id="pillUrgent">⚡ Срочно</div>
      <div class="option-pill" id="pillTag">🏷️ Тег</div>
    </div>

    <div class="sheet-actions">
      <button class="btn-sheet-submit" id="btnSheetSubmit">Готово</button>
    </div>
  </div>

  <!-- ШТОРКА НАСТРОЕК (СТРОГО ЗДЕСЬ ПОЛЕ ДЛЯ КЛЮЧА) -->
  <div class="bottom-sheet" id="settingsSheet">
    <div class="sheet-grabber"></div>
    <div class="sheet-title">Настройки</div>
    
    <div style="font-size: 12px; color: var(--hint); margin-bottom: 8px; font-weight: 600; text-transform: uppercase;">Тема оформления</div>
    <div class="theme-grid">
      <div class="theme-card active" data-set-theme="midnight">
        <div class="theme-preview" style="background: #0b0f19; border: 1px solid #388bfd;">🌌</div>
        <div class="theme-name">Сапфир</div>
      </div>
      <div class="theme-card" data-set-theme="aurora">
        <div class="theme-preview" style="background: #0e091b; border: 1px solid #bf5af2;">🔮</div>
        <div class="theme-name">Aurora</div>
      </div>
      <div class="theme-card" data-set-theme="warm">
        <div class="theme-preview" style="background: #f6f5f0; color: #2c2523; border: 1px solid #d9532f;">🕯️</div>
        <div class="theme-name">Песок</div>
      </div>
      <div class="theme-card" data-set-theme="oled">
        <div class="theme-preview" style="background: #000000; border: 1px solid #333;">🕶️</div>
        <div class="theme-name">OLED</div>
      </div>
    </div>

    <div style="font-size: 12px; color: var(--hint); margin: 16px 0 8px; font-weight: 600; text-transform: uppercase;">Голосовой ввод (Groq Whisper API)</div>
    <input type="text" id="groqKeyInput" placeholder="Вставьте ключ gsk_..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="width: 100%; background: var(--bg); border: 1px solid var(--separator); padding: 12px 14px; border-radius: 12px; color: var(--text); font-size: 14px; outline: none; margin-bottom: 20px;">

    <div class="sheet-actions">
      <button class="btn-sheet-submit" id="btnCloseSettings">Закрыть</button>
    </div>
  </div>

  <script>
    /* СОСТОЯНИЕ */
    const STORAGE_KEY = 'smart_tasks_apple_v6';
    const THEME_KEY = 'smart_tasks_theme_v1';
    let tasks = [];
    let currentTag = null;
    let isDoneExpanded = false;
    let currentTheme = localStorage.getItem(THEME_KEY) || 'midnight';
    let editingTaskId = null;

    let sheetState = { date: 'none', urgent: false, tag: 'none' };
    const TAG_EMOJIS = { 'работа': '💼', 'дом': '🏠', 'купить': '🛒', 'спорт': '🏋️', 'деньги': '💳' };

    const tg = window.Telegram?.WebApp;

    function applyTheme(themeName) {
      currentTheme = themeName;
      document.body.setAttribute('data-theme', themeName);
      localStorage.setItem(THEME_KEY, themeName);
      document.querySelectorAll('.theme-card').forEach(card => {
        card.classList.toggle('active', card.dataset.setTheme === themeName);
      });
    }

    /* ПАРСИНГ */
    function parseTask(rawText, explicitDate, explicitUrgent, explicitTag) {
      if (!rawText || !rawText.trim()) return null;

      let text = rawText.trim();
      let priority = explicitUrgent ? 'high' : 'normal';
      let tags = explicitTag !== 'none' ? [explicitTag] : [];
      let deadline = null;

      try {
        const now = new Date();
        if (explicitDate === 'today') {
          now.setHours(23, 59, 59, 999);
          deadline = now.toISOString();
        } else if (explicitDate === 'tomorrow') {
          now.setDate(now.getDate() + 1);
          now.setHours(23, 59, 59, 999);
          deadline = now.toISOString();
        }

        const priorityRegex = /(?:^|\s)(срочно|важно|!!!)(?:\s|$)/gi;
        if (priorityRegex.test(text)) {
          priority = 'high';
          text = text.replace(priorityRegex, ' ').trim();
        }

        const tagRegex = /(?:^|\s)#([a-zA-Zа-яА-ЯёЁ0-9_-]+)/g;
        let tagMatch;
        while ((tagMatch = tagRegex.exec(text)) !== null) {
          tags.push(tagMatch[1].toLowerCase());
        }
        text = text.replace(tagRegex, ' ').trim();

        if (!deadline) {
          const chronoParser = window.chrono?.ru || window.chrono;
          if (chronoParser) {
            const parsed = chronoParser.parse(text, new Date(), { forwardDate: true });
            if (parsed && parsed.length > 0) {
              deadline = parsed[0].date().toISOString();
              text = text.replace(parsed[0].text, ' ').trim();
            }
          }
        }
      } catch (err) {}

      let cleanedTitle = text.replace(/\s+/g, ' ').trim();
      if (cleanedTitle.length > 0) {
        cleanedTitle = cleanedTitle.charAt(0).toUpperCase() + cleanedTitle.slice(1);
      }

      return {
        id: 't_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        title: cleanedTitle || rawText.trim(),
        deadline: deadline,
        priority: priority,
        tags: [...new Set(tags)],
        completed: false,
        createdAt: new Date().toISOString()
      };
    }
/* СТРИКИ ПРОДУКТИВНОСТИ */
    const STREAK_KEY = 'smart_tasks_streak_v1';
    let streakData = JSON.parse(localStorage.getItem(STREAK_KEY) || '{"count":0,"lastDate":""}');

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function getYesterdayKey() {
      const d = new Date(Date.now() - 86400000);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function updateStreakBadge() {
      const badge = document.getElementById('streakBadge');
      if (!badge) return;
      const today = getTodayKey();
      const yesterday = getYesterdayKey();

      // Если пропустили день — стрик сгорает
      if (streakData.lastDate && streakData.lastDate !== today && streakData.lastDate !== yesterday) {
        streakData.count = 0;
        localStorage.setItem(STREAK_KEY, JSON.stringify(streakData));
      }

      if (streakData.count > 0) {
        badge.style.display = 'inline-block';
        badge.textContent = `🔥 ${streakData.count} дн.`;
      } else {
        badge.style.display = 'none';
      }
    }

    function recordStreakOnComplete() {
      const today = getTodayKey();
      const yesterday = getYesterdayKey();

      if (streakData.lastDate === today) return; // Сегодня уже засчитано

      if (streakData.lastDate === yesterday) {
        streakData.count += 1;
      } else {
        streakData.count = 1;
      }

      streakData.lastDate = today;
      localStorage.setItem(STREAK_KEY, JSON.stringify(streakData));
      updateStreakBadge();
    }
    /* ХРАНИЛИЩЕ */
    const isCloudSupported = Boolean(tg?.isVersionAtLeast && tg.isVersionAtLeast('6.9') && tg.CloudStorage);

    function saveTasks() {
      const dataStr = JSON.stringify(tasks);
      localStorage.setItem(STORAGE_KEY, dataStr);
      if (isCloudSupported) {
        tg.CloudStorage.setItem(STORAGE_KEY, dataStr, () => {});
      }
    }

    function loadTasks() {
      return new Promise((resolve) => {
        if (isCloudSupported) {
          tg.CloudStorage.getItem(STORAGE_KEY, (err, val) => {
            if (!err && val) {
              try { resolve(JSON.parse(val)); return; } catch (e) {}
            }
            loadLocal(resolve);
          });
        } else {
          loadLocal(resolve);
        }
      });
    }

    function loadLocal(resolve) {
      try {
        const local = localStorage.getItem(STORAGE_KEY);
        resolve(local ? JSON.parse(local) : []);
      } catch (e) { resolve([]); }
    }
/* ЗВУКОВОЙ ДВИЖОК APPLE (WEB AUDIO API) */
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playUiSound(type = 'click') {
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'complete') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
          osc.start();
          osc.stop(ctx.currentTime + 0.18);
        } else if (type === 'delete') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
          osc.start();
          osc.stop(ctx.currentTime + 0.09);
        }
      } catch (e) {}
    }
    /* ДЕЙСТВИЯ */
    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      task.completed = !task.completed;
      saveTasks();
      render();

      if (task.completed) {
        tg?.HapticFeedback?.notificationOccurred('success');
        recordStreakOnComplete();
        playUiSound('complete');
        if (typeof confetti === 'function') {
          confetti({ particleCount: 40, spread: 60, origin: { y: 0.75 }, colors: ['#388bfd', '#32d74b', '#bf5af2'] });
        }
      } else {
        tg?.HapticFeedback?.impactOccurred('light');
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      render();
      tg?.HapticFeedback?.impactOccurred('medium');
      playUiSound('delete');
    }

    /* ШТОРКИ */
    function openSheet() {
      editingTaskId = null;
      sheetState = { date: 'none', urgent: false, tag: 'none' };

    function openEditSheet(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      editingTaskId = id;
      sheetState.urgent = task.priority === 'high';
      sheetState.tag = (task.tags && task.tags.length > 0) ? task.tags[0] : 'none';

      if (task.deadline) {
        const d = new Date(task.deadline);
        const now = new Date();
        const tomorrow = new Date();
        tomorrow.setDate(now.getDate() + 1);
        if (d.toDateString() === now.toDateString()) sheetState.date = 'today';
        else if (d.toDateString() === tomorrow.toDateString()) sheetState.date = 'tomorrow';
        else sheetState.date = 'none';

    function updateSheetPills() {
      const pDate = document.getElementById('pillDate');
      if (sheetState.date === 'today') { pDate.textContent = '📅 Сегодня'; pDate.className = 'option-pill active'; }
      else if (sheetState.date === 'tomorrow') { pDate.textContent = '📅 Завтра'; pDate.className = 'option-pill active'; }
      else { pDate.textContent = '📅 Срок'; pDate.className = 'option-pill'; }

      }

    function submitSheet() {
      const input = document.getElementById('sheetInput');
      const val = input.value;
      if (!val || !val.trim()) { closeAllSheets(); return; }

      const parsed = parseTask(val, sheetState.date, sheetState.urgent, sheetState.tag);
      if (parsed) {
        if (editingTaskId) {
          const idx = tasks.findIndex(t => t.id === editingTaskId);
          if (idx !== -1) {
            tasks[idx].title = parsed.title;
            tasks[idx].deadline = parsed.deadline;
            tasks[idx].priority = parsed.priority;
            tasks[idx].tags = parsed.tags;
          }
          editingTaskId = null;
        } else {
          tasks.unshift(parsed);
        }
        saveTasks();
        render();
        tg?.HapticFeedback?.notificationOccurred('success');
      }
      closeAllSheets();
    }

    function formatMetaDate(isoString) {
      if (!isoString) return null;
      const d = new Date(isoString);
      const now = new Date();
      const isOverdue = d < now;
      const isToday = d.toDateString() === now.toDateString();
      const tomorrow = new Date();
      tomorrow.setDate(now.getDate() + 1);
      const isTomorrow = d.toDateString() === tomorrow.toDateString();
      const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if (isToday) return { text: `Сегодня, ${time}`, isOverdue };
      if (isTomorrow) return { text: `Завтра, ${time}`, isOverdue: false };
      return { text: `${d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}, ${time}`, isOverdue };
    }

    /* РЕНДЕР */
    function render() {
      const now = new Date();
      document.getElementById('headerDate').textContent = 
        now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });

      const activeTasks = tasks.filter(t => !t.completed);
      const doneTasks = tasks.filter(t => t.completed);
      document.getElementById('progressText').textContent = `${doneTasks.length}/${tasks.length}`;

      const allTags = new Set();
      tasks.forEach(t => t.tags?.forEach(tag => allTags.add(tag)));
      const tagsBar = document.getElementById('tagsBar');
      tagsBar.innerHTML = '';

      if (allTags.size > 0) {
        const allChip = document.createElement('div');
        allChip.className = `tag-chip ${currentTag === null ? 'active' : ''}`;
        allChip.textContent = 'Все';
        allChip.onclick = () => { currentTag = null; render(); };
        tagsBar.appendChild(allChip);

        allTags.forEach(tag => {
          const chip = document.createElement('div');
          chip.className = `tag-chip ${currentTag === tag ? 'active' : ''}`;
          chip.textContent = `${TAG_EMOJIS[tag] || '🏷️'} #${tag}`;
          chip.onclick = () => { currentTag = currentTag === tag ? null : tag; render(); };
          tagsBar.appendChild(chip);
        });
      }

      const visibleActive = activeTasks.filter(t => !currentTag || t.tags?.includes(currentTag));
      const todayGroup = [];
      const upcomingGroup = [];
      const noDateGroup = [];

      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const endOfToday = startOfToday + 86400000 - 1;

      visibleActive.forEach(task => {
        if (!task.deadline) noDateGroup.push(task);
        else {
          const dTime = new Date(task.deadline).getTime();
          if (dTime <= endOfToday) todayGroup.push(task);
          else upcomingGroup.push(task);
        }
      });

      const sortByDeadline = (a, b) => new Date(a.deadline) - new Date(b.deadline);
      todayGroup.sort(sortByDeadline);
      upcomingGroup.sort(sortByDeadline);

      const secContainer = document.getElementById('sectionsContainer');
      secContainer.innerHTML = '';

      if (visibleActive.length === 0 && doneTasks.length === 0) {
        secContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">✍️</div>
            <div class="empty-state-title">Все дела сделаны</div>
            <div class="empty-state-desc">Нажмите «+» внизу для новой задачи</div>
          </div>
        `;
      }

      if (todayGroup.length > 0) renderSection(secContainer, 'Сегодня', todayGroup, 'var(--danger)');
      if (upcomingGroup.length > 0) renderSection(secContainer, 'Предстоящие', upcomingGroup, 'var(--tint)');
      if (noDateGroup.length > 0) renderSection(secContainer, 'Без даты', noDateGroup, 'var(--hint)');

      const accContainer = document.getElementById('doneAccordionContainer');
      accContainer.innerHTML = '';

     if (doneTasks.length > 0) {
        const accHeader = document.createElement('div');
        accHeader.style.display = 'flex';
        accHeader.style.alignItems = 'center';
        accHeader.style.justifyContent = 'space-between';
        accHeader.style.padding = '4px 6px 4px 14px';

        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'accordion-toggle';
        toggleBtn.style.padding = '0';
        toggleBtn.style.margin = '0';
        toggleBtn.style.width = 'auto';
        toggleBtn.innerHTML = `<span>Выполнено (${doneTasks.length}) ${isDoneExpanded ? '▲' : '▼'}</span>`;
        toggleBtn.onclick = () => { 
          isDoneExpanded = !isDoneExpanded; 
          render(); 
          tg?.HapticFeedback?.impactOccurred('light'); 
        };

        const clearBtn = document.createElement('button');
        clearBtn.style.background = 'none';
        clearBtn.style.border = 'none';
        clearBtn.style.color = 'var(--danger)';
        clearBtn.style.fontSize = '12px';
        clearBtn.style.fontWeight = '600';
        clearBtn.style.cursor = 'pointer';
        clearBtn.style.padding = '6px 8px';
        clearBtn.textContent = 'Очистить 🗑️';
        clearBtn.onclick = () => {
          tasks = tasks.filter(t => !t.completed);
          saveTasks();
          render();
          tg?.HapticFeedback?.notificationOccurred('warning');
          playUiSound('delete');
        };

        accHeader.appendChild(toggleBtn);
        accHeader.appendChild(clearBtn);
        accContainer.appendChild(accHeader);

        if (isDoneExpanded) renderSection(accContainer, null, doneTasks, null, true);
      }
      updateStreakBadge();
    }

    function renderSection(parentEl, title, taskList, accentColor) {
      const section = document.createElement('div');
      section.className = 'section-container';

      if (title) {
        const secTitle = document.createElement('div');
        secTitle.className = 'section-title';
        if (accentColor) secTitle.style.color = accentColor;
        secTitle.textContent = `${title} • ${taskList.length}`;
        section.appendChild(secTitle);
      }

      const cardGroup = document.createElement('div');
      cardGroup.className = 'section-card-group';

      taskList.forEach(task => {
        const wrapper = document.createElement('div');
        wrapper.className = 'swipe-row-wrapper';

        const bgRight = document.createElement('div');
        bgRight.className = 'swipe-reveal-bg right';
        bgRight.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

        const bgLeft = document.createElement('div');
        bgLeft.className = 'swipe-reveal-bg left';
        bgLeft.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';

        const row = document.createElement('div');
        row.className = `task-row ${task.completed ? 'completed' : ''}`;

        const chkBox = document.createElement('div');
        chkBox.className = 'checkbox-touch';
        chkBox.onclick = (e) => { e.stopPropagation(); toggleTask(task.id); };
        const chkCircle = document.createElement('div');
        chkCircle.className = 'checkbox-circle';
        chkBox.appendChild(chkCircle);

        const content = document.createElement('div');
        content.className = 'task-content';
        content.onclick = () => openEditSheet(task.id);

        const titleEl = document.createElement('div');
        titleEl.className = 'task-title';
        titleEl.textContent = task.title;
        content.appendChild(titleEl);

        const meta = document.createElement('div');
        meta.className = 'task-meta';

        if (task.priority === 'high' && !task.completed) {
          const m = document.createElement('span');
          m.className = 'meta-tag urgent';
          m.textContent = '⚡ Срочно';
          meta.appendChild(m);
        }

        if (task.deadline) {
          const dInfo = formatMetaDate(task.deadline);
          if (dInfo) {
            const m = document.createElement('span');
            m.className = `meta-tag ${dInfo.isOverdue && !task.completed ? 'overdue' : ''}`;
            m.textContent = (dInfo.isOverdue && !task.completed ? '⚠️ ' : '🕒 ') + dInfo.text;
            meta.appendChild(m);
          }
        }

        if (task.tags && task.tags.length > 0) {
          task.tags.forEach(t => {
            const m = document.createElement('span');
            m.className = 'meta-tag category';
            m.textContent = `${TAG_EMOJIS[t] || '🏷️'} #${t}`;
            meta.appendChild(m);
          });
        }

        if (meta.children.length > 0) content.appendChild(meta);

        row.appendChild(chkBox);
        row.appendChild(content);

        // Чистый сдвиг плашки овала
        let startX = 0;
        let startY = 0;
        let currentDiffX = 0;
        let isHorizontal = false;
        let triggeredHaptic = false;

        row.addEventListener('touchstart', (e) => {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          currentDiffX = 0;
          isHorizontal = false;
          triggeredHaptic = false;
          row.style.transition = 'none';
        }, { passive: true });

        row.addEventListener('touchmove', (e) => {
          const diffX = e.touches[0].clientX - startX;
          const diffY = e.touches[0].clientY - startY;

          if (!isHorizontal && Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 8) {
            isHorizontal = true;
          }

          if (isHorizontal) {
            // Эластичное натяжение
            const maxDrag = 90;
            if (Math.abs(diffX) > maxDrag) {
              const extra = Math.abs(diffX) - maxDrag;
              currentDiffX = (diffX > 0 ? 1 : -1) * (maxDrag + extra * 0.3);
            } else {
              currentDiffX = diffX;
            }

            // Двигаем только сам овал
            row.style.transform = `translate3d(${currentDiffX}px, 0, 0)`;

            // Показываем ТОЛЬКО нужный цвет за овалом (без наложения текстов)
            if (currentDiffX > 8) {
              bgRight.style.display = 'flex';
              bgLeft.style.display = 'none';
            } else if (currentDiffX < -8) {
              bgLeft.style.display = 'flex';
              bgRight.style.display = 'none';
            } else {
              bgRight.style.display = 'none';
              bgLeft.style.display = 'none';
            }

            if (Math.abs(currentDiffX) >= 75 && !triggeredHaptic) {
              tg?.HapticFeedback?.selectionChanged();
              triggeredHaptic = true;
            } else if (Math.abs(currentDiffX) < 75 && triggeredHaptic) {
              triggeredHaptic = false;
            }
          }
        }, { passive: true });

        row.addEventListener('touchend', () => {
          // Мягкий отскок овала на место
          row.style.transition = 'transform 0.32s cubic-bezier(0.175, 0.885, 0.32, 1.15)';
          row.style.transform = 'translate3d(0, 0, 0)';

          if (currentDiffX >= 75) {
            toggleTask(task.id);
          } else if (currentDiffX <= -75) {
            deleteTask(task.id);
          }

          setTimeout(() => {
            bgRight.style.display = 'none';
            bgLeft.style.display = 'none';
          }, 320);
        });
        wrapper.appendChild(bgRight);
        wrapper.appendChild(bgLeft);
        wrapper.appendChild(row);
        cardGroup.appendChild(wrapper);
      });

      section.appendChild(cardGroup);
      parentEl.appendChild(section);
    }

    /* ИНИЦИАЛИЗАЦИЯ И МИКРОФОН */
    document.addEventListener('DOMContentLoaded', async () => {
      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
      }

      applyTheme(currentTheme);

      // Ключ Groq
      const keyInput = document.getElementById('groqKeyInput');
      if (keyInput) {
        keyInput.value = localStorage.getItem('groq_whisper_key') || '';
        keyInput.addEventListener('input', () => {
          localStorage.setItem('groq_whisper_key', keyInput.value.trim());
        });
      }

      // Кнопки
      document.getElementById('fabBtn').addEventListener('click', openSheet);
      document.getElementById('btnSettings').addEventListener('click', openSettings);
      document.getElementById('sheetBackdrop').addEventListener('click', closeAllSheets);
      document.getElementById('btnCloseSettings').addEventListener('click', closeAllSheets);
      document.getElementById('btnSheetSubmit').addEventListener('click', submitSheet);
      document.getElementById('sheetInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); submitSheet(); }
      });

      document.querySelectorAll('.theme-card').forEach(card => {
        card.addEventListener('click', () => {
          applyTheme(card.dataset.setTheme);
          tg?.HapticFeedback?.selectionChanged();
        });
      });

      document.getElementById('pillDate').addEventListener('click', () => {
        if (sheetState.date === 'none') sheetState.date = 'today';
        else if (sheetState.date === 'today') sheetState.date = 'tomorrow';
        else sheetState.date = 'none';
        updateSheetPills();
      });

      document.getElementById('pillUrgent').addEventListener('click', () => {
        sheetState.urgent = !sheetState.urgent;
        updateSheetPills();
      });

      const tagsCycle = ['none', 'работа', 'дом', 'купить', 'спорт', 'деньги'];
      document.getElementById('pillTag').addEventListener('click', () => {
        const nextIdx = (tagsCycle.indexOf(sheetState.tag) + 1) % tagsCycle.length;
        sheetState.tag = tagsCycle[nextIdx];
        updateSheetPills();
      });

      // Запись звука и Whisper
      let mediaRecorder = null;
      let audioChunks = [];
      let isRecording = false;

      const btnVoice = document.getElementById('btnVoice');
      if (btnVoice) {
        btnVoice.addEventListener('click', async () => {
          const apiKey = localStorage.getItem('groq_whisper_key') || '';
          if (!apiKey) {
            alert('Сначала укажите ключ Groq в Настройках (шестеренка ⚙️)');
            openSettings();
            return;
          }

          if (isRecording) {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            return;
          }

          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            let mimeType = 'audio/webm';
            if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
            else if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';

            mediaRecorder = new MediaRecorder(stream, { mimeType });
            audioChunks = [];

            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };

            mediaRecorder.onstart = () => {
              isRecording = true;
              btnVoice.classList.add('recording');
              btnVoice.textContent = '⏹️';
              tg?.HapticFeedback?.impactOccurred('medium');
            };

            mediaRecorder.onstop = async () => {
              isRecording = false;
              btnVoice.classList.remove('recording');
              btnVoice.textContent = '⏳';
              stream.getTracks().forEach(track => track.stop());

              if (audioChunks.length === 0) { btnVoice.textContent = '🎙️'; return; }

              const audioBlob = new Blob(audioChunks, { type: mimeType });
              try {
                const ext = mimeType.includes('mp4') ? 'm4a' : 'webm';
                const formData = new FormData();
                formData.append('file', audioBlob, `audio.${ext}`);
                formData.append('model', 'whisper-large-v3-turbo');
                formData.append('language', 'ru');

                const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                  method: 'POST',
                  headers: { 'Authorization': `Bearer ${apiKey}` },
                  body: formData
                });

                if (!response.ok) throw new Error('API error');
                const data = await response.json();
                if (data.text) {
                  const sInput = document.getElementById('sheetInput');
                  sInput.value = sInput.value ? `${sInput.value} ${data.text.trim()}` : data.text.trim();
                  tg?.HapticFeedback?.notificationOccurred('success');
                }
              } catch (err) {
                alert('Ошибка распознавания. Проверьте ключ в настройках.');
              } finally {
                btnVoice.textContent = '🎙️';
              }
            };

            mediaRecorder.start();
          } catch (err) {
            alert('Разрешите доступ к микрофону в Telegram.');
          }
        });
      }

      tasks = await loadTasks();
      render();
    });
  </script>
</body>
</html>
